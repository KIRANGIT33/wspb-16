stages:
  - lint
  - build
  - test
  - e2e
  - publish

client-lint:
  stage: lint
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run lint

server-lint:
  stage: lint
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run lint

client-build:
  stage: build
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run build

server-build:
  stage: build
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run build

server-tests:
  stage: test
  image: node:22
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app_pw
    POSTGRES_DB: app_test_db
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: app
    PGPASSWORD: app_pw
    PGDATABASE: app_test_db
  before_script:
    - apt-get update
    - apt-get install -y postgresql-client
    - until pg_isready -h postgres -U app -d app_test_db; do sleep 1; done
    - PGPASSWORD=app_pw psql -h postgres -U app -d app_test_db -f db/init/001-schema.sql
  script:
    - cd server
    - npm ci
    - npm run test

e2e-tests:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app_pw
    POSTGRES_DB: app_test_db
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: app
    PGPASSWORD: app_pw
    PGDATABASE: app_test_db
  before_script:
    - apt-get update
    - apt-get install -y postgresql-client
    - until pg_isready -h postgres -U app -d app_test_db; do sleep 1; done
    - PGPASSWORD=app_pw psql -h postgres -U app -d app_test_db -f db/init/001-schema.sql
  script:
    - cd server
    - npm ci
    - npm run build
    - npm run start:ci &
    - cd ../client
    - npm ci
    - npm run dev -- --host 0.0.0.0 --port 8080 &
    - sleep 5
    - npm run test:e2e

publish-server:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    IMAGE: "$CI_REGISTRY_IMAGE/server"
  before_script:
    - apk add --no-cache nodejs
    - echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" -u gitlab-ci-token --password-stdin
  script:
    - VERSION=$(node -p "require('./server/package.json').version")
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" server
    - docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$VERSION"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:$VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish-client:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    IMAGE: "$CI_REGISTRY_IMAGE/client"
  before_script:
    - apk add --no-cache nodejs
    - echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" -u gitlab-ci-token --password-stdin
  script:
    - VERSION=$(node -p "require('./client/package.json').version")
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" client
    - docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$VERSION"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:$VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
