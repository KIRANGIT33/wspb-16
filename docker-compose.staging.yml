services:
  client:
    image: ${CI_REGISTRY_IMAGE}/client:${IMAGE_TAG}
    ports:
      - "80:80"
    environment:
      API_URL: ${API_URL}
    depends_on:
      - server

  server:
    image: ${CI_REGISTRY_IMAGE}/server:${IMAGE_TAG}
    ports:
      - "3001:3001"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: app
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: app_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data: