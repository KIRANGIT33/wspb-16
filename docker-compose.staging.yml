services:
  server:
    image: ${SERVER_IMAGE}
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PGHOST: db
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
    depends_on:
      db:
        condition: service_healthy

  client:
    image: ${CLIENT_IMAGE}
    restart: always
    ports:
      - "80:80"
    environment:
      API_URL: ${API_URL}

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/001-staging-schema.sql:/docker-entrypoint-initdb.d/001-staging-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: